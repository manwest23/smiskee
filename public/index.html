<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMISKEE</title>
<meta name="description" content="SMISKEE helps bank employees check in on stress, play short games with their leaders, earn vouchers and get a weekly recap.">
<meta name="theme-color" content="#183b32">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem("smiskee-theme");document.documentElement.dataset.theme=(t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"light"}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SMISKEE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css?v=dev">
</head>
<body>
<button class="skip" data-act="skip">Skip to content</button>
<div class="app" id="app"><div class="loading"><span class="splash"><img src="icons/logo-full.png" alt="SMISKEE"></span><p>Loading…</p></div></div>
<nav class="nav" id="nav" hidden></nav>
<div class="sheet" id="sheet" hidden><div class="sheet-panel pad" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1"><div class="sheet-head"><h2 id="sheet-title"></h2><button class="x" data-act="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="sheet-body"></div></div></div>
<noscript><p style="padding:24px;font-family:sans-serif">SMISKEE needs JavaScript to run.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js?v=dev"></script>
<script src="i18n-id.js?v=dev"></script>
<script src="app.js?v=dev"></script>
<script>
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
